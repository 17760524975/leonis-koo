<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#fff;overflow:hidden}#w{position:relative;overflow:hidden}img{position:absolute;image-rendering:pixelated;transform-origin:0 0}</style>
<div id="w"><img id="i" src="ref.png"></div>
<script>
const q=new URLSearchParams(location.search);
const x=+(q.get('x')||0), y=+(q.get('y')||0), w=+(q.get('w')||120), h=+(q.get('h')||120), s=+(q.get('s')||6);
const im=document.getElementById('i'), box=document.getElementById('w');
im.style.left=(-x*s)+'px'; im.style.top=(-y*s)+'px';
im.style.width=(800*s)+'px'; im.style.height=(616*s)+'px';
box.style.width=(w*s)+'px'; box.style.height=(h*s)+'px';
</script>
