<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>audio-probe</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; background: #F6E9D4; }
  #game { width: 375px; height: 812px; display: block; }
  #safe-probe { position: fixed; top: 0; left: 0; padding: 0; height: 0; }
  #out { position: fixed; left: 0; top: 0; z-index: 99; background: #fff; font: 12px monospace; white-space: pre; }
</style>
</head>
<body>
<!-- v0.11 音频探针：用真实预览端 game.js 验证 <audio> 换曲链路。
     放在 tools/ 下，把 AUDIO.base 指到 ../preview/assets/audio/，不污染交付包。
     用法：msedge --headless=new --dump-dom --autoplay-policy=no-user-gesture-required
                --virtual-time-budget=6000 tools/audio_probe.html -->
<canvas id="game"></canvas>
<div id="safe-probe" aria-hidden="true"></div>
<pre id="out">BOOT</pre>

<script src="../preview/js/config.js"></script>
<script>
  // 探针在 tools/ 目录下运行，资源目录要指回 preview/
  window.TANGRAM_CONFIG.AUDIO.base = '../preview/assets/audio/';
</script>
<script src="../preview/js/geom.js"></script>
<script src="../preview/js/judge.js"></script>
<script src="../preview/js/levels.js"></script>
<script src="../preview/js/core.js"></script>
<script src="../preview/js/cloud.js"></script>
<script src="../preview/js/ad.js"></script>
<script src="../preview/js/game.js"></script>
<script>
(function () {
  var out = [];
  function log(k, v) { out.push(k + '=' + v); }
  function flush(tag) {
    document.getElementById('out').textContent = tag + '\n' + out.join('\n');
    document.title = tag;
  }
  setTimeout(function () {
    try {
      var A = window.__audio;
      if (!A) { flush('NO_AUDIO'); return; }
      A.unlock();
      var s1 = A.bgmInfo();
      log('home.src', s1 ? s1.src.split('/').pop() : 'null');
      log('home.loop', s1 ? s1.loop : 'null');
      log('home.paused', s1 ? s1.paused : 'null');
      log('home.vol', s1 ? s1.volume.toFixed(2) : 'null');
      A.setScene('lv2');
      setTimeout(function () {
        var s2 = A.bgmInfo();
        log('lv2.src', s2 ? s2.src.split('/').pop() : 'null');
        log('lv2.vol', s2 ? s2.volume.toFixed(2) : 'null');
        A.duck(true);
        setTimeout(function () {
          log('duck.vol', A.bgmInfo().volume.toFixed(2));
          A.duck(false);
          A.setEnabled(true, false);
          log('off.paused', A.bgmInfo().paused);
          A.setEnabled(true, true);
          setTimeout(function () {
            log('on.paused', A.bgmInfo().paused);
            log('on.src', A.bgmInfo().src.split('/').pop());
            flush('DONE');
          }, 200);
        }, 420);
      }, 420);
    } catch (e) {
      log('ERR', (e && e.message) || e);
      flush('ERR');
    }
  }, 600);
})();
</script>
</body>
</html>
