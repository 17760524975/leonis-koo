<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>audio-probe</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; background: #F6E9D4; }
  #game { width: 375px; height: 812px; display: block; }
  #safe-probe { position: fixed; top: 0; left: 0; padding: 0; height: 0; }
  #out { position: fixed; left: 0; top: 0; z-index: 99; background: #fff; font: 12px monospace; white-space: pre; }
</style>
</head>
<body>
<!-- v0.11 音频探针：用真实预览端 game.js 验证 <audio> 换曲链路。
     放在 tools/ 下，把 AUDIO.base 指到 ../preview/assets/audio/，不污染交付包。
     用法：msedge --headless=new --dump-dom --autoplay-policy=no-user-gesture-required
                --virtual-time-budget=6000 tools/audio_probe.html -->
<canvas id="game"></canvas>
<div id="safe-probe" aria-hidden="true"></div>
<pre id="out">BOOT</pre>

<script src="../preview/js/config.js"></script>
<script>
  // 探针在 tools/ 目录下运行，资源目录要指回 preview/
  window.TANGRAM_CONFIG.AUDIO.base = '../preview/assets/audio/';
</script>
<script src="../preview/js/geom.js"></script>
<script src="../preview/js/judge.js"></script>
<script src="../preview/js/levels.js"></script>
<script src="../preview/js/core.js"></script>
<script src="../preview/js/cloud.js"></script>
<script src="../preview/js/ad.js"></script>
<script src="../preview/js/game.js"></script>
<script>
/* v0.12 探针：真实浏览器里跑预览端，验两套链路
 *   主页 = 合成和弦（pad=true，走 bgmGain 总线，没有 <audio> 元素）
 *   关卡 = mp3（pad=false，<audio> 在放，volume=bgmVolume）
 * 关键点：切场景时两者必须互斥（不会同时在响）。 */
(function () {
  var out = [];
  function log(k, v) { out.push(k + '=' + v); }
  function flush(tag) {
    document.getElementById('out').textContent = tag + '\n' + out.join('\n');
    document.title = tag;
  }
  setTimeout(function () {
    try {
      var A = window.__audio;
      if (!A) { flush('NO_AUDIO'); return; }
      A.unlock();
      var s1 = A.bgmInfo();
      log('home.on', s1.home);
      log('home.gate', s1.gate === null ? 'null' : s1.gate.toFixed(2));
      log('home.gain', s1.gain === null ? 'null' : s1.gain.toFixed(2));
      log('home.preloaded', s1.preloaded);
      log('home.playingMp3', s1.playing);

      /* 关键：切场景必须"同步生效"——调用返回后立刻读状态，不等定时器 */
      A.setScene('lv2');
      var s2 = A.bgmInfo();
      log('lv2.home', s2.home);
      log('lv2.file', s2.file || '(none)');
      log('lv2.pausedNow', s2.paused);
      log('lv2.readyNow', s2.ready === undefined ? '(none)' : s2.ready);
      setTimeout(function () {
        var s2b = A.bgmInfo();
        log('lv2.vol', s2b.volume === undefined ? '(none)' : s2b.volume.toFixed(2));
        log('lv2.readyLater', s2b.ready === undefined ? '(none)' : s2b.ready);
        /* v0.14.1：进关卡 400ms 后必须还在放（旧版会被预载的 pause 掐掉） */
        log('lv2.stillPlaying', s2b.paused === false && s2b.playing === 1);
        A.duck(true);
        setTimeout(function () {
          log('duck.vol', A.bgmInfo().volume.toFixed(2));
          A.duck(false);
          A.setScene('home');
          var s4 = A.bgmInfo();                 // 同步读：回主页那一刻
          log('back.home', s4.home);
          log('back.playingMp3', s4.playing);
          log('back.gate', s4.gate === null ? 'null' : s4.gate.toFixed(2));
          setTimeout(function () {
            A.setEnabled(true, false);
            log('off.home', A.bgmInfo().home);
            log('off.gain', A.bgmInfo().gain === null ? 'null' : A.bgmInfo().gain.toFixed(2));
            A.setEnabled(true, true);
            setTimeout(function () {
              var s5 = A.bgmInfo();
              log('on.home', s5.home);
              log('on.gain', s5.gain === null ? 'null' : s5.gain.toFixed(2));
              flush('DONE');
            }, 300);
          }, 400);
        }, 300);
      }, 400);
    } catch (e) {
      log('ERR', (e && e.message) || e);
      flush('ERR');
    }
  }, 600);
})();
</script>
</body>
</html>
