<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>版式验收 harness</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#EFDFC6;}
  #game{display:block;width:100vw;height:100vh;touch-action:none;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="../preview/js/config.js"></script>
<script src="../preview/js/geom.js"></script>
<script src="../preview/js/judge.js"></script>
<script src="../preview/js/levels.js"></script>
<script src="../preview/js/core.js"></script>
<script src="../preview/js/cloud.js"></script>
<script src="../preview/js/ad.js"></script>
<script>
/* 版式验收 harness（浏览器截图用，不开真实交互、不放音频）
 * 参数：
 *   ?screen=home|levels|play|hint|result|settings
 *   &w=375              画布宽度（默认 750）
 *   &fake=120           把关卡数据复制成 N 关（验证 120 关版式，不改真实文件）
 *   &placed=2           对局页预先放上几块板
 *   &tier=1/2/3         强制提示档（v0.3.1 A2 三档截图）
 *   &sel=0              把第 N 块板设为选中并放到棋盘（v0.3.1 A3 旋转手柄截图）
 *   &mark=1             叠加标记：红十字=质心，蓝圈=新手柄圆心（v0.3.2 B1 截图）
 *   &dragcenter=1       模拟「已选中板件再次按质心并拖动」→ 截图验证不旋转（v0.3.2 B1）
 *   &traysel=1          选中托盘里第一块板（v0.3.2 B2 托盘高亮截图）
 *   &profile=anon|auto|wx|custom  玩家资料态（v0.14 设置页/榜单截图）：
 *                       anon=未授权、auto=系统化名、wx=已授权微信昵称头像、custom=自定义名
 */
(function () {
  var C = window.TANGRAM_CONFIG;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var q = location.search;

  // fake=N：复制关卡数据，用于验证 120 关版式
  var fakeN = +(q.match(/fake=(\d+)/) || [])[1] || 0;
  if (fakeN) {
    var D = window.TANGRAM_DATA, base = D.levels, out = [];
    for (var i = 0; i < fakeN; i++) {
      var s = base[i % base.length];
      out.push({ id: i + 1, name: s.name, tip: s.tip, chapter: Math.floor(i / 20) + 1,
                 outline: s.outline, solution: s.solution });
    }
    D.levels = out;
  }

  /* v0.14 玩家资料桩：浏览器里没有 wx，用假的把四种身份态画出来。
   * 头像用内联 SVG（不是真微信图），只为验证「圆形裁剪 + 首字回退」两套画法。 */
  var avatarUrl = 'https://thirdwx.qlogo.cn/mmopen/fake/132';
  var avatarImg = new Image();
  (function () {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96">' +
      '<rect width="96" height="96" fill="#7FB3E8"/>' +
      '<circle cx="48" cy="37" r="17" fill="#FFF6E8"/>' +
      '<path d="M13 96c0-19 16-30 35-30s35 11 35 30z" fill="#FFF6E8"/></svg>';
    avatarImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  })();
  var profMode = (q.match(/profile=(\w+)/) || [])[1] || 'anon';
  var profileStub = {
    enabled: function () { return true; },
    canAuth: function () { return profMode !== 'wx'; },
    state: function () { return { nick: '', avatar: '', src: 'auto', auth: false }; },
    restore: function () {}, boot: function () {}, request: function () {}, rename: function () {},
    onChange: function () {},
    place: function () { return false; },       // 截图里不建原生按钮，画布按钮就是最终样子
    hide: function () {},
    imageOf: function () { return (avatarImg.complete && avatarImg.naturalWidth) ? avatarImg : null; }
  };

  var images = {};
  var loaded = 0, need = Object.keys(C.ART.files).length;
  var inputFn = null;
  var gameRef = null;

  /* v0.3.2 验收叠加层：只写在额外 canvas 上，游戏 rAF 只重画 #game，标记不会被冲掉 */
  function overlayNote(lines, marks) {
    var oc = document.createElement('canvas');
    oc.width = canvas.width; oc.height = canvas.height;
    oc.style.cssText = 'position:fixed;left:0;top:0;z-index:9;pointer-events:none';
    document.body.appendChild(oc);
    var o = oc.getContext('2d');
    var k = canvas.width / C.DESIGN.w;
    o.font = 'bold ' + Math.round(16 * Math.max(k, 0.8)) + 'px sans-serif';
    o.textBaseline = 'top';
    o.fillStyle = '#C62828';
    for (var i = 0; i < lines.length; i++) o.fillText(lines[i], 14 * k + 8, 14 * k + i * 24 * k);
    for (var m = 0; m < marks.length; m++) {
      var mk = marks[m], x = mk.x * k, y = mk.y * k;
      o.strokeStyle = mk.color; o.lineWidth = Math.max(2, 2 * k);
      if (mk.type === 'cross') {
        o.beginPath(); o.moveTo(x - 10 * k, y); o.lineTo(x + 10 * k, y);
        o.moveTo(x, y - 10 * k); o.lineTo(x, y + 10 * k); o.stroke();
      } else {
        o.beginPath(); o.arc(x, y, 12 * k, 0, Math.PI * 2); o.stroke();
      }
    }
  }

  function boot() {
    var game = window.TANGRAM_CORE({
      ctx: ctx,
      size: function () {
        var m = q.match(/w=(\d+)/);
        var mh = q.match(/[&?]h=(\d+)/);
        /* v0.46：支持 &h=（物理高 CSS px），用来模拟真机纵横比。
         * 默认仍按设计比例 1624 推出来（w=750 时就是 1624）。 */
        if (m && mh) return { w: +m[1], h: +mh[1] };
        return m ? { w: +m[1], h: 1624 * (+m[1]) / 750 } : { w: 750, h: 1624 };
      },
      dpr: function () { return 1; },
      /* v0.46：&safeTop=<CSS px> 模拟真机安全区（灵动岛机型 iPhone 15/16/17 = 59~62）。
       * 不传时为 0，走 config.SAFE.top=88 的设计基准 —— 与验收脚本口径一致。 */
      safeInsets: function () {
        var st = q.match(/safeTop=(\d+)/);
        var sb = q.match(/safeBottom=(\d+)/);
        return { top: st ? +st[1] : 0, bottom: sb ? +sb[1] : 0 };
      },
      bindInput: function (fn) { inputFn = fn; },
      storage: { get: function () { return null; }, set: function () {} },
      audio: { unlock: function () {}, setEnabled: function () {}, play: function () {}, duck: function () {} },
      vibrate: function () {},
      images: images,
      ad: window.TANGRAM_AD.createAd(),          // v0.9：截图里画出广告位占位框
      cloud: window.TANGRAM_CLOUD.createCloud(), // 浏览器无云：榜单走降级分支
      profile: profileStub,                      // v0.14：玩家资料桩
      onHide: function () {},
      onShow: function () {}
    });
    game.init();
    var S = game.state;
    /* v0.14：按 profile= 参数把资料填进去（云端/授权在真机上也是这么进来的） */
    if (profMode === 'wx') {
      game._debug.applyProfile({ nick: '古月三金', avatar: avatarUrl, src: 'wx', auth: true }, false);
    } else if (profMode === 'custom') {
      game._debug.applyProfile({ nick: '七巧小将', avatar: avatarUrl, src: 'custom', auth: true }, false);
    } else if (profMode === 'auto') {
      game._debug.applyProfile({ nick: '巧手4287', avatar: '', src: 'auto', auth: false }, false);
    }
    // v0.3 Phase 0：set=tangram7 切到七巧板数据集（截图验收用）
    var setKey = (q.match(/set=(\w+)/) || [])[1];
    if (setKey === 'tangram7') game._debug.useSet('tangram7');
    var screen = (q.match(/screen=(\w+)/) || [])[1] || 'home';
    var placed = +(q.match(/placed=(\d+)/) || [])[1];
    if (isNaN(placed)) placed = (screen === 'tut') ? 0 : 2;   // v0.21：教学关默认一块都不放
    var tier = +(q.match(/tier=(\d+)/) || [])[1];       // v0.3 A3：强制提示档 1/2/3（同关三档截图）
    var last = +(q.match(/last=(\d+)/) || [])[1] || 0;  // v0.3 A7：结算显示「全部完成」文案

    if (screen === 'levels') {
      var unlocked = +(q.match(/unlocked=(\d+)/) || [])[1];
      S.save.unlockedMax = isNaN(unlocked) ? 3 : unlocked;
      S.save.starOf = { 1: 3, 2: 2, 3: 1 };
      S.page = 'levels'; S.fade = 1; S.pageT = 9999;
      var pg = +(q.match(/page=(\d+)/) || [])[1];
      if (!isNaN(pg)) S.lvPage = pg;
      /* v0.50：关卡页纵向滚动位置（字母 26 关合成一章后需要滚动，截图要能滑到中间） */
      var lvs = +(q.match(/lvscroll=(\d+)/) || [])[1];
      if (!isNaN(lvs)) S.lvScroll = lvs;
    } else if (screen === 'play' || screen === 'hint' || screen === 'result' || screen === 'tut') {
      // 用 core 当前数据集的关卡表（切 set 后是 60 关七巧板），不能再用全局 TANGRAM_DATA.levels
      var LIB = game._debug.LEVELS;
      var lvIdx = +(q.match(/level=(\d+)/) || [])[1] || 0;
      if (last) lvIdx = LIB.length - 1;                 // 让 renderResult 走 COMPLETE_TITLE 分支
      if (lvIdx >= LIB.length) lvIdx = LIB.length - 1;
      game._debug.setupLevel(lvIdx);
      S.page = 'play'; S.fade = 1; S.pageT = 9999; S.elapsed = 63.4; S.steps = 7;
      /* v0.21：left=<秒> 指定倒计时余量，用来截「重开不重置倒计时」的对照图 */
      var leftArg = +(q.match(/left=(\d+)/) || [])[1];
      if (!isNaN(leftArg)) { S.timeLeft = leftArg; S.hearts = 1; }
      /* v0.22：items=<n> 查找道具余量 —— 用来截工具栏角标（有几个显示几个） */
      var itemArg = +(q.match(/items=(\d+)/) || [])[1];
      if (!isNaN(itemArg)) S.save.hintItems = itemArg;
      if (!isNaN(tier) && tier >= 1 && tier <= 3) S.hintTier = tier;
      var lv = LIB[lvIdx];
      for (var i = 0; i < placed; i++) {
        var p = S.pieces[i];
        var st = lv.solution.filter(function (x) { return x.id === p.id; })[0];
        if (!st) continue;
        p.onBoard = true; p.x = st.x; p.y = st.y;
        p.angle = st.angle; p.dAngle = st.angle;
        p.flipped = st.flipped; p.dFlipped = st.flipped;
      }
      // 覆盖率必须跑真实判定，不能手填（手填会截出「只放两块却 100%」的假象）
      var jr = game._debug.judgeNow();
      S.covFrom = jr.coverage; S.covTo = jr.coverage; S.cov = jr.coverage; S.covT = 1;
      /* v0.21：教学关想截「翻面 / 转角度」那一步，得先让别的块都摆对、只留一块不对。
       *   tutflip=N 第 N 块摆到位但翻面反了；tutrot=N 第 N 块摆到位但角度歪 40°。 */
      var tflip = +(q.match(/tutflip=(\d+)/) || [])[1];
      var trot = +(q.match(/tutrot=(\d+)/) || [])[1];
      var tfix = !isNaN(tflip) ? tflip : trot;
      if (!isNaN(tfix) && S.pieces[tfix]) {
        var tp = S.pieces[tfix];
        var ts = lv.solution.filter(function (x) { return x.id === tp.id; })[0];
        if (ts) {
          tp.onBoard = true; tp.x = ts.x; tp.y = ts.y;
          tp.angle = ts.angle; tp.dAngle = ts.angle;
          tp.flipped = !isNaN(tflip) ? !ts.flipped : ts.flipped;
          tp.dFlipped = tp.flipped;
          if (!isNaN(trot)) { tp.angle = (ts.angle + 40) % 360; tp.dAngle = tp.angle; S.selId = tp.id; }
        }
      }
      // v0.3.1 A3：sel=N 把第 N 块板放到棋盘中央并选中，用于旋转手柄截图
      var selArg = +(q.match(/sel=(\d+)/) || [])[1];
      if (!isNaN(selArg) && S.pieces[selArg]) {
        var sp2 = S.pieces[selArg];
        var st2 = lv.solution.filter(function (x) { return x.id === sp2.id; })[0];
        sp2.onBoard = true;
        sp2.x = st2 ? st2.x : 500; sp2.y = st2 ? st2.y : 500;
        sp2.angle = 0; sp2.dAngle = 0;
        S.selId = sp2.id;
      } else {
        S.selId = S.pieces[2] && S.pieces[2].id;
        if (screen === 'tut') S.selId = null;   // 教学截图不要旋转手柄来抢戏
      }
      if (screen === 'hint') {
        /* v0.15：&items=<n> 提示卡数量（0/不传 = 没有卡，看「获取指引」文案） */        var hit0 = +(q.match(/items=(\d+)/) || [])[1];
        S.save.hintItems = isNaN(hit0) ? 0 : hit0;
        /* v0.20：提示只有一档（哪块 + 放哪），不再有 hinttier。
         * v0.11：hintbad=N 把第 N 块摆歪，用来截「已上板但没放对」的提示；
         *        不指定时按真实逻辑取第一块没上板的（旧版固定指 solution[0]，
         *        一旦那块已上板，截图里就只剩一句 toast、什么提示都看不到）。 */
        var hbad = +(q.match(/hintbad=(\d+)/) || [])[1];
        var hid = null;
        if (!isNaN(hbad) && S.pieces[hbad]) {
          var hbp = S.pieces[hbad];
          hbp.onBoard = true;
          /* 摆歪 = 在棋盘上但位置/角度不对：要先把它挪到棋盘里，
           * 否则托盘坐标 (0,0) 上板后会画到左上角、压住 HUD（截图里就废了） */
          var hbst = lv.solution.filter(function (ss) { return ss.id === hbp.id; })[0];
          if (hbst) { hbp.x = hbst.x + 72; hbp.y = hbst.y + 56; }
          hbp.angle = (hbp.angle + 40) % 360; hbp.dAngle = hbp.angle;
          hid = hbp.id;
        } else {
          for (var hi = 0; hi < S.pieces.length; hi++) {
            if (!S.pieces[hi].onBoard) { hid = S.pieces[hi].id; break; }
          }
          if (!hid) hid = lv.solution[0] && lv.solution[0].id;
        }
        /* v0.20：单档常驻 —— 没有 tier、没有 until，toast 也只说"下一步" */
        S.hintLv = 1;
        S.hintUsed = true;
        S.hint = { id: hid, t: 0 };
        S.msg = '已标出下一步：圈起来的那块，放到虚线处';
        S.msgT = 1500;
      }
      if (screen === 'result') {
        S.overlay = 'result'; S.resT = 1000; S.starShown = 3;
        /* v0.23：first=<0|1> 首通/重复、rw=<n> 首通奖励、ad=<0|1> 是否已看视频翻倍。
         * v0.40：prev=<n> 本局之前的星级、best=<n> 本关最高星级 —— 用来截「升到 ★★ · +N」。
         * v0.43：奖励口径回正（1★2 / 2★3 / 3★5），默认值从 +21 改成 +5。 */
        var rFirst = +(q.match(/first=(\d+)/) || [])[1];
        var rGain = +(q.match(/rw=(\d+)/) || [])[1];
        var rAd = +(q.match(/ad=(\d+)/) || [])[1];
        var rPrev = +(q.match(/prev=(\d+)/) || [])[1];
        var rBest = +(q.match(/best=(\d+)/) || [])[1];
        var rStars = +(q.match(/stars=(\d+)/) || [])[1];   // v0.41：本局星级（默认 3）
        S.result = {
          stars: isNaN(rStars) ? 3 : rStars, time: 63.4, steps: 9,
          first: isNaN(rFirst) ? true : !!rFirst,
          prevStars: isNaN(rPrev) ? 0 : rPrev,
          bestStars: isNaN(rBest) ? 3 : rBest,
          gain: isNaN(rGain) ? 5 : rGain,
          adUsed: isNaN(rAd) ? false : !!rAd
        };
        S.win = { t: 2000 };
        /* v0.8：连胜条截图 —— stk=N 指定连胜数，gain=N 指定刚拿到的里程碑奖励 */
        var stk = +(q.match(/stk=(\d+)/) || [])[1];
        S.save.streak = isNaN(stk) ? 3 : stk;
        /* v0.19：连胜 = 本段内已计过的关数，集合按 streak 补齐（截图用） */
        S.save.streakSeen = [];
        for (var si2 = 1; si2 <= S.save.streak; si2++) S.save.streakSeen.push(String(si2));
        var gain = +(q.match(/gain=(\d+)/) || [])[1];
        S.streakGain = isNaN(gain) ? 0 : gain;
      }
    } else if (screen === 'hintpanel') {
      /* v0.10：提示面板。v0.16 起每关不再送免费档，lv=0 就是「卖第 1 档」。
       * v0.22：加 level=<n>，默认第 3 关 —— 第 1 关是教学关，面板会和教学指令叠在一起。 */
      var hpLv = +(q.match(/level=(\d+)/) || [])[1];
      game._debug.setupLevel(isNaN(hpLv) ? 2 : hpLv);
      S.page = 'play'; S.fade = 1; S.pageT = 9999;
      /* v0.20：没有档位了，lv 只当"已经买过几次"的计数 */
      var hl = +(q.match(/(?:^|[&?])lv=(\d+)/) || [])[1];
      S.hintLv = isNaN(hl) ? 0 : hl; S.hintUsed = true;
      var coinQ = +(q.match(/coin=(\d+)/) || [])[1];
      S.save.coin = isNaN(coinQ) ? 168 : coinQ;
      /* v0.16：&items=<n> 查找道具数量（0/不传 = 没有道具） */
      var itemQ = +(q.match(/items=(\d+)/) || [])[1];
      S.save.hintItems = isNaN(itemQ) ? 0 : itemQ;
      S.overlay = 'hint';
    } else if (screen === 'rank') {
      /* v0.8：排行榜浮层（tab=0 主线 / 1 连胜 / 2 好友） */
      S.page = 'home'; S.fade = 1; S.pageT = 9999; S.overlay = 'rank'; S.rankT = 999;
      S.save.starOf = { 1: 3, 2: 3, 3: 2, 4: 3, 5: 1, 6: 2, 7: 3, 8: 2, 9: 1, 10: 2, 11: 3, 12: 1 };
      S.save.streak = 7;
      S.save.bestStreak = 7;                 // v0.18：连胜榜按历史最高排
      /* v0.19：连胜口径改成「段内去重」，7 连胜 = 段内已计过 7 关 */
      S.save.streakSeen = ['1', '2', '3', '4', '5', '6', '7'];
      var rtab = +(q.match(/tab=(\d+)/) || [])[1];
      if (!isNaN(rtab)) S.rankTab = rtab;
      /* v0.18：好友榜在浏览器里没有开放数据域 → &friendmock=1 用示例好友验版式 */
      if (/friendmock=1/.test(q)) { C.RANK.useMock = true; S.rankTab = 2; }
      /* v0.18：&rankerr=1 复现「加载失败 + 重新加载」页 */
      if (/rankerr=1/.test(q)) {
        S.rankErr = '网络超时'; S.rankList = null;
        S.rankCache = { 0: null, 1: null };
        S.rankCache[0] = null;
      }
      /* v0.9：ranklive=1 注入「云端已返回的一组真实形状」数据，
       * 因为浏览器预览没有云环境，默认会显示"未开启云同步" */
      if (/ranklive=1/.test(q)) {
        S.rankList = { list: [
          { nick: '巧手0001', v: 26, me: false }, { nick: '巧手3308', v: 21, me: false },
          { nick: '巧手7752', v: 18, me: false }, { nick: '巧手0921', v: 12, me: true },
          { nick: '巧手4417', v: 9, me: false }, { nick: '巧手6620', v: 6, me: false }
        ], me: { nick: '巧手0921', v: 12, rank: 4 } };
        S.net = { on: true, ready: true, nick: '巧手0921', syncing: false, ts: 1, err: '' };
        /* v0.14：资料态下把化名换成人名 + 头像，验证榜单头像是真头像而不是首字 */
        if (profMode === 'wx' || profMode === 'custom') {
          var myName = profMode === 'custom' ? '七巧小将' : '古月三金';
          var rn = ['拼图小将', '木木不吃鱼', '小满', myName, '彩云之川', '阿树'];
          for (var ri = 0; ri < S.rankList.list.length; ri++) {
            S.rankList.list[ri].nick = rn[ri] || S.rankList.list[ri].nick;
            S.rankList.list[ri].avatar = avatarUrl;
          }
          S.rankList.me.nick = myName;
          S.net.nick = myName;
        }
      }
      if (/net=1/.test(q)) S.net = { on: true, ready: true, nick: '巧手0921', syncing: false, ts: 1, err: '' };
    } else if (screen === 'settings') {
      if (/net=1/.test(q)) S.net = { on: true, ready: true, nick: '巧手0921', syncing: false, ts: 1, err: '' };
      S.page = 'home'; S.fade = 1; S.overlay = 'settings';
    } else if (screen === 'energy' || screen === 'invite' ||
               screen === 'desktop' || screen === 'skin' || screen === 'online') {
      /* v0.5：主页弹窗截图（体力/邀请/桌面/皮肤）；v0.16 起「任务」已下线 */
      S.page = 'home'; S.fade = 1; S.pageT = 9999; S.overlay = screen;
      S.save.coin = 168; S.save.energy = 12;
      if (screen === 'energy') { S.save.freeEnergyDay = ''; S.save.freeEnergyUsed = 0; }
      if (screen === 'invite') {
        /* v0.41：&ic=<人数> 累计邀请数、&ig=<1,2,3> 已领档位、&ip=<n> 待确认数 */
        var ic = +(q.match(/ic=(\d+)/) || [])[1];
        if (!isNaN(ic)) S.save.inviteCount = ic;
        var ig = (q.match(/ig=([\d,]+)/) || [])[1];
        S.save.inviteGot = ig ? ig.split(',').map(Number) : [];
        var ip = +(q.match(/ip=(\d+)/) || [])[1];
        /* v0.42：&iscroll=<px> 直接给出列表滚动位置（给 9999 就是滑到底） */
        var isc = (q.match(/iscroll=(\d+)/) || [])[1];
        if (isc !== undefined) S.inviteScroll = +isc;
        S.save.invitePend = [];
        for (var ii = 0; ii < (isNaN(ip) ? 0 : ip); ii++) {
          S.save.invitePend.push(Date.now() - 1000);   // 未到等待期 → 只显示「在闯关中」
        }
      }
      if (screen === 'online') {
        /* v0.15：&online=<秒> 今日累计时长；&ogot=1,2 已领档位；&items=<n> 查找道具数量 */
        var os = +(q.match(/online=(\d+)/) || [])[1];
        if (!isNaN(os)) S.save.onlineSec = os;
        var td2 = new Date();
        S.save.onlineDay = td2.getFullYear() + '-' + (td2.getMonth() + 1) + '-' + td2.getDate();
        S.save.onlineGot = {};
        var og = (q.match(/ogot=([\d,]+)/) || [])[1];
        if (og) og.split(',').forEach(function (n) { S.save.onlineGot['o' + n] = true; });
        var it = +(q.match(/items=(\d+)/) || [])[1];
        S.save.hintItems = isNaN(it) ? 0 : it;
      }
    } else if (screen === 'fail') {
      /* v0.5：复活弹窗（倒计时归零）
       * v0.23：支持 level=<n> —— 第 1 关是教学关，教学指令会透过遮罩露在弹窗上方 */
      var LIBF = game._debug.LEVELS;
      var fLv = +(q.match(/level=(\d+)/) || [])[1] || 0;
      game._debug.setupLevel(fLv);
      S.page = 'play'; S.fade = 1; S.pageT = 9999;
      S.timeLimit = game._debug.timeLimitOf(LIBF[fLv]);
      S.timeLeft = 0; S.hearts = 0;
      /* v0.48：failT=<ms> 用来定格失败动画的某一帧（不传=0，即红闪最亮那一刻） */
      S.overlay = 'fail'; S.failT = +(q.match(/failT=(\d+)/) || [])[1] || 0;
      /* v0.18：失败时 streak 已经清零落盘，断点前的值放在 streakBeforeFail 里
       * v0.19：连胜改成「段内去重」，断点集合也要一起恢复才画得对 */
      S.save.streak = 0; S.streakBeforeFail = 7; S.save.bestStreak = 9;
      S.save.streakSeen = [];
      S.seenBeforeFail = ['1', '2', '3', '4', '5', '6', '7'];
      S.save.coin = 210;
    }
    /* v0.15：主页也支持 &online=<秒>，用来看「可领 N」气泡与累计时长气泡 */
    var qOn = +(q.match(/online=(\d+)/) || [])[1];
    if (!isNaN(qOn) && screen === 'home') {
      var qd = new Date();
      S.save.onlineDay = qd.getFullYear() + '-' + (qd.getMonth() + 1) + '-' + qd.getDate();
      S.save.onlineSec = qOn;
      S.save.onlineGot = {};
    }
    /* v0.3.4 A4a：?flower=<ms> 冻结鲜花在某关键帧，便于 headless 截图逐帧验收。
     * >660ms 时同时打开结算面板，检查「鲜花不吞结算按钮、面板画在鲜花之上」。 */
    var flowerMs = +(q.match(/flower=(\d+)/) || [])[1];
    if (!isNaN(flowerMs) && screen === 'play') {
      S.win = { t: flowerMs };
      S.flower = { t: flowerMs };
      S.running = false;
      S.result = { stars: 3, time: 63.4, steps: 7 };
      /* v0.6：结算面板 900ms 进场（FLOWER.overlayAt），阈值同步改 900 */
      if (flowerMs > 900) { S.overlay = 'result'; S.resT = 300; S.starShown = 3; }
      var frozenT = flowerMs;
      Object.defineProperty(S.flower, 't', {
        get: function () { return frozenT; }, set: function () {}, configurable: true
      });
      // win.t 也冻结：否则 headless 等待截图期间会自动跨过 660ms 弹出结算，
      // 把「绽放峰值」帧意外变成「绽放+结算」帧，截图不可复现。
      Object.defineProperty(S.win, 't', {
        get: function () { return frozenT; }, set: function () {}, configurable: true
      });
      // full=1：截图时强制关闭低帧率降级，让 6 朵卫星花全部出现以便对照演示页
      if ((q.match(/full=(\d+)/) || [])[1] === '1') {
        Object.defineProperty(S, 'lowFps', {
          get: function () { return false; }, set: function () {}, configurable: true
        });
      }
    }
    /* v0.6：?t=<ms> 冻结 state.time，用于对比底纹动效在两个时刻的画面 */
    var fxT = +(q.match(/(?:^|[&?])t=(\d+)/) || [])[1];
    if (!isNaN(fxT)) {
      S.time = fxT;
      Object.defineProperty(S, 'time', {
        get: function () { return fxT; }, set: function () {}, configurable: true
      });
    }
    /* v0.5：?skin=warm|mint|night 预览皮肤 */
    var skinKey = (q.match(/skin=(\w+)/) || [])[1];
    if (skinKey && C.SKINS[skinKey]) { game._debug.applySkin(skinKey); S.toast = null; }
    /* v0.27：视觉风格截图参数
     *   ?bgfx=aurora|stars|bubbles|petals|geometric|classic  背景特效
     *   &pstyle=candy|wood|neon|pastel|classic               板件样式
     *   &sfx=bell|water|retro|wood                           音效风格（仅状态，截图无声）
     *   &skinpanel=1&skintab=0..3                            直接打开皮肤面板并选页签 */
    var bgfxKey = (q.match(/bgfx=(\w+)/) || [])[1];
    if (bgfxKey && game._debug.applyBgFx) game._debug.applyBgFx(bgfxKey);
    var psKey = (q.match(/pstyle=(\w+)/) || [])[1];
    if (psKey && game._debug.applyPieceStyle) game._debug.applyPieceStyle(psKey);
    var sfxKey2 = (q.match(/sfx=(\w+)/) || [])[1];
    if (sfxKey2 && game._debug.applySfxStyle) game._debug.applySfxStyle(sfxKey2);
    if ((q.match(/skinpanel=(\d+)/) || [])[1] === '1') {
      S.overlay = 'skin';
      var st = +(q.match(/skintab=(\d+)/) || [])[1];
      if (!isNaN(st)) S.skinTab = st;
    }
    /* v0.39：?buy=pstyle:neon / &buy=bgfx:stars 直接打开「解锁皮肤」确认页。
     * 只是把状态摆好截图，不扣巧币（真正的扣费在 buySkinItem 里）。 */
    var buyQ = q.match(/[&?]buy=(\w+):(\w+)/);
    if (buyQ) {
      var buyMap = buyQ[1] === 'pstyle' ? C.PIECE_STYLES : C.BG_FX;
      var buyIt = buyMap && buyMap[buyQ[2]];
      if (buyIt) {
        S.buyItem = { kind: buyQ[1], key: buyQ[2], price: buyIt.price || 0,
          name: buyIt.name, desc: buyIt.desc };
        S.overlay = 'buy';
      }
    }
    S.toast = null;
    /* v0.5：?toast=1 关闭提示气泡，避免遮挡截图 */
    if ((q.match(/notoast=(\d+)/) || [])[1] === '1') S.toast = null;
    gameRef = game;
    var mark = +(q.match(/mark=(\d+)/) || [])[1] || 0;
    var dragCenter = +(q.match(/dragcenter=(\d+)/) || [])[1] || 0;
    var traysel = +(q.match(/traysel=(\d+)/) || [])[1] || 0;
    if (traysel && screen === 'play') {
      var tp0 = S.pieces.filter(function (p) { return !p.onBoard; })[0];
      if (tp0) S.selId = tp0.id;
    }
    var marks = [], lines = [];
    if (screen === 'play' && (mark || dragCenter) && S.selId && inputFn) {
      var mp = S.pieces.filter(function (p) { return p.id === S.selId; })[0];
      if (mp) {
        var k = canvas.width / C.DESIGN.w;
        var WS = C.LAYOUT.BOARD.size / 1000;
        var cd = [C.LAYOUT.BOARD.x + mp.x * WS, C.LAYOUT.BOARD.y + mp.y * WS];
        if (dragCenter) {
          inputFn('down', cd[0] * k, cd[1] * k);
          inputFn('move', (cd[0] + 60) * k, cd[1] * k);
          inputFn('up', (cd[0] + 60) * k, cd[1] * k);
          cd = [C.LAYOUT.BOARD.x + mp.x * WS, C.LAYOUT.BOARD.y + mp.y * WS];
          lines.push('质心按下并右拖 60 设计px');
          lines.push('angle=' + mp.angle + '° dAngle=' + mp.dAngle + '°（均应为 0）');
        }
        var hd = game._debug.handleAt(mp);
        marks.push({ type: 'cross', x: cd[0], y: cd[1], color: '#D32F2F' });
        marks.push({ type: 'ring', x: hd[0], y: hd[1], color: '#1976D2' });
        if (!lines.length) lines.push('红十=质心拖拽区  蓝圈=角上手柄');
      }
    }
    if (marks.length) overlayNote(lines, marks);
    /* v0.17：&coin=<n>&energy=<n> 直接指定顶栏要显示的余量（对局页 HUD 截图验收用）。
     * 放在最后统一覆盖，这样 fail 分支自己设的 210 也能被 &coin= 改掉做对照实验。 */
    var qCoin = +(q.match(/(?:^|[&?])coin=(\d+)/) || [])[1];
    if (!isNaN(qCoin)) S.save.coin = qCoin;
    var qEn = +(q.match(/(?:^|[&?])energy=(\d+)/) || [])[1];
    if (!isNaN(qEn)) S.save.energy = Math.min(qEn, S.save.energyMax);
    S.fade = 1;              // 截图时强制淡入完成，避免截到页面过渡中间态
    /* v0.48：&freezeFail=1 把 failT 钉成常量，避免 rAF 推进导致截图帧不确定 */
    if ((q.match(/freezeFail=(\d+)/) || [])[1] === '1' && screen === 'fail') {
      var fixedT = +(q.match(/failT=(\d+)/) || [])[1] || 0;
      Object.defineProperty(S, 'failT', {
        get: function () { return fixedT; }, set: function () {}, configurable: true
      });
    }
    window.__ready = true;

  }

  function one() { if (++loaded >= need) boot(); }
  if (!need) { boot(); } else {
    Object.keys(C.ART.files).forEach(function (k) {
      var img = new Image();
      img.onload = function () { images[k] = img; one(); };
      img.onerror = function () { one(); };
      img.src = '../preview/' + C.ART.base.replace(/^\.\//, '') + C.ART.files[k];
    });
  }
})();
</script>
</body>
</html>
