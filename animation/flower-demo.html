<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>鲜花绽放动效演示 · v0.3.4 A4a</title>
<style>
  :root{
    --bg:#EFDFC6; --card:#FFFFFF; --wood:rgba(199,164,120,.18);
    --ink:#2C3A4B; --sub:#7A8A9C; --gold:#FF9F1C; --goldDeep:#E08A00;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#E7D3B3;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;gap:22px;flex-wrap:wrap}
  .stage{position:relative;width:375px;height:812px;flex:0 0 auto;
    border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(90,60,30,.28);background:var(--bg)}
  canvas{display:block;width:375px;height:812px}
  .panel{width:300px;flex:0 0 auto;background:#fff;border-radius:18px;padding:20px;
    box-shadow:0 8px 30px rgba(90,60,30,.18)}
  .panel h1{font-size:19px;margin:0 0 4px;letter-spacing:.5px}
  .panel .sub{font-size:12px;color:var(--sub);margin-bottom:16px;line-height:1.6}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:700;
    cursor:pointer;color:#7A4A00;background:#FFB93D;border-bottom:4px solid #E08A00;
    margin:0 8px 8px 0;transition:transform .08s ease-out,border-bottom-width .08s ease-out;user-select:none}
  .btn:active{transform:translateY(2px);border-bottom-width:2px}
  .btn.ghost{background:#F4F6F9;color:#5A6B7B;border-bottom-color:#C3CDD9}
  .btn.on{background:#FFD98A;border-bottom-color:#E08A00}
  .tl{margin-top:14px}
  .tlbar{height:12px;border-radius:6px;background:#EEF1F5;position:relative;overflow:hidden}
  .tlfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#FFC53D,#FF8A5B)}
  .tlmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:#7A8A9C;left:66%}
  .tlpeak{position:absolute;top:-3px;bottom:-3px;width:3px;background:#D96A9B;left:24.2%}
  .stage-label{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.7}
  .stage-label b{color:var(--ink)}
  .kv{font-size:12px;color:var(--sub);margin-top:14px;border-top:1px solid #E3E9F2;padding-top:12px;line-height:1.9}
  .kv code{background:#F4F6F9;padding:1px 5px;border-radius:4px;color:#B4552A;font-size:11px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage"><canvas id="cv" width="750" height="1624"></canvas></div>
  <div class="panel">
    <h1>🌸 鲜花绽放 · 动效演示</h1>
    <div class="sub">v0.3.4 A4a ｜ 白动远 ｜ 纯 Canvas 绘制、零图片素材<br>画面为 750×1624 设计稿的 0.5× 预览，与游戏内一致。</div>
    <div>
      <button class="btn" id="replay">↻ 重放</button>
      <button class="btn ghost" id="slow">0.25× 慢放</button>
      <button class="btn ghost" id="stageBtn">单帧：峰值</button>
    </div>
    <div class="tl">
      <div class="tlbar"><div class="tlfill" id="tlfill"></div><div class="tlpeak" title="242ms 主花峰值＝音乐顶点重音（音画同锤）"></div><div class="tlmark" title="660ms 结算面板出现"></div></div>
      <div class="stage-label" id="stageLabel">阶段：<b>孕育</b>　t = 0 ms</div>
    </div>
    <div class="kv">
      <b style="color:var(--ink)">核心参数</b><br>
      1 主花(7瓣七色) + 6 卫星花(5瓣)<br>
      总时长 <code>1000ms</code>，名义终点 <code>1.08</code>／过冲视觉峰 <code>1.14@242ms</code><br>
      绽放 <code>easeOutBack</code> / 展开·弹开 <code>easeOutCubic</code> / 淡出 <code>easeIn</code><br>
      <span class="dot" style="background:#D96A9B"></span>粉线 = 242ms 主花峰值＝音乐顶点重音（音画同锤）<br>
      <span class="dot" style="background:#7A8A9C"></span>灰线 = 660ms 结算面板出现时刻<br>
      <span class="dot" style="background:#FF9F1C"></span>橙条 = 当前播放进度
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var D = {w:750,h:1624};
var slow = false, t = 0, last = 0, playing = true, holdFrame = -1;

/* ---- 缓动（与 js/geom.js 完全一致） ---- */
function easeOutCubic(t){ return 1 - Math.pow(1-t,3); }
function easeOutBack(t){ var c1=1.70158,c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
function easeIn(t){ return t*t; }
function clamp01(x){ return x<0?0:(x>1?1:x); }
function seg(t,a,b){ return clamp01((t-a)/(b-a)); }

/* ---- 规格常量（对应 spec §7 FLOWER） ---- */
var COLORS = ['#FF8A5B','#4FA8E0','#63C88B','#A87BE8','#D96A9B','#FFC53D','#3FB8B0'];
var MAIN = {x:375, y:470, petals:7, L:64};
var TOTAL = 1000, BUD_END = 80, BLOOM_END = 360, SETTLE_END = 560, FADE_FROM = 660;
var SATS = [
  {ang:-90, color:1, size:.72, delay:120},
  {ang:-30, color:5, size:.64, delay:165},
  {ang: 30, color:2, size:.74, delay:210},
  {ang: 90, color:4, size:.66, delay:255},
  {ang:150, color:3, size:.72, delay:300},
  {ang:210, color:6, size:.64, delay:345}
].map(function(s){
  var r = s.ang*Math.PI/180, dist=170;
  s.tx = MAIN.x + dist*Math.cos(r);
  s.ty = MAIN.y + dist*Math.sin(r)*0.82;
  return s;
});

/* ---- 主绘花函数：与 spec §8 一致，程序可整段照抄 ---- */
function drawFlower(cx, cy, scale, alpha, bloomP, colorList, petalN, L, spin){
  if (alpha <= 0 || scale <= 0) return;
  ctx.save();
  ctx.translate(cx, cy);
  if (spin) ctx.rotate(spin);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  var len = L * (0.15 + 0.85 * easeOutCubic(bloomP));
  var w = len * 0.42;
  for (var i=0;i<petalN;i++){
    var base = colorList[i % colorList.length];
    ctx.save();
    ctx.rotate((i*2*Math.PI/petalN) * easeOutCubic(bloomP));
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-w, -len*0.55, 0, -len);
    ctx.quadraticCurveTo( w, -len*0.55, 0, 0);
    ctx.closePath();
    ctx.fillStyle = base; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = shade(base,-12); ctx.stroke();
    ctx.restore();
  }
  // 花心
  ctx.beginPath(); ctx.arc(0,0,L*0.22,0,7); ctx.fillStyle='#FFC53D'; ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle=shade('#FFC53D',-14); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,L*0.09,0,7); ctx.fillStyle='#FFFFFF'; ctx.fill();
  ctx.restore();
}
function shade(hex, pct){
  var n = parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r*(1+pct/100))));
  g=Math.max(0,Math.min(255,Math.round(g*(1+pct/100))));
  b=Math.max(0,Math.min(255,Math.round(b*(1+pct/100))));
  return 'rgb('+r+','+g+','+b+')';
}

/* ---- 时间轴 → 各元素状态 ---- */
function flowerState(t){
  // 主花
  var bud = seg(t,0,BUD_END);
  var bloom = seg(t,BUD_END,BLOOM_END);
  var settle = seg(t,BLOOM_END,SETTLE_END);
  var fade = seg(t,FADE_FROM,TOTAL);
  var s;
  if (t <= BUD_END) s = 0.25 + 0.20*easeOutCubic(bud);
  else if (t <= BLOOM_END) s = 0.45 + (1.08-0.45)*easeOutBack(bloom);
  else if (t <= SETTLE_END) s = 1.08 + (1.0-1.08)*easeOutCubic(settle);
  else s = 1.0;
  var a;
  if (t <= BUD_END) a = 0.5*easeOutCubic(bud);
  else if (t <= BLOOM_END) a = 0.5 + 0.5*easeOutCubic(bloom);
  else a = 1;
  if (t > FADE_FROM){ a = 1-easeIn(fade); s = 1.0 + (0.90-1.0)*easeIn(fade); }
  var spin = (t > SETTLE_END) ? Math.min(1,(t-SETTLE_END)/(FADE_FROM-SETTLE_END))*6*Math.PI/180 : 0;
  var main = { s:s, a:a, p:bloom, spin:spin };

  // 卫星花
  var sats = SATS.map(function(cfg){
    var p = seg(t, cfg.delay, cfg.delay+240);
    if (p<=0) return {cx:MAIN.x,cy:MAIN.y,s:0,a:0,p:0};
    var mv = easeOutCubic(p);
    var sc = cfg.size*easeOutBack(p);
    var al = easeOutCubic(seg(t,cfg.delay,cfg.delay+80));
    if (t>FADE_FROM){ al = 1-easeIn(fade); sc = cfg.size+(cfg.size*0.9-cfg.size)*easeIn(fade); }
    return {
      cx: MAIN.x+(cfg.tx-MAIN.x)*mv,
      cy: MAIN.y+(cfg.ty-MAIN.y)*mv,
      s: Math.max(0,sc), a: al, p: p, cfg: cfg
    };
  });
  return { main:main, sats:sats, fade:fade };
}

/* ---- 背景：暖木桌 + 白卡 + 刚拼好的图案示意（纯示意线稿，非美术素材） ---- */
function drawBG(){
  // 暖木桌底纹
  ctx.fillStyle='#EFDFC6'; ctx.fillRect(0,0,D.w,D.h);
  ctx.strokeStyle='rgba(199,164,120,0.18)'; ctx.lineWidth=2;
  for (var y=40;y<D.h;y+=54){ ctx.beginPath(); ctx.moveTo(0,y); ctx.bezierCurveTo(200,y+6,500,y-6,750,y); ctx.stroke(); }
  // 白卡
  roundRect(24,176,702,702,26); ctx.fillStyle='#FFFFFF'; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='#E3E9F2'; ctx.stroke();
  // 目标图案示意：中心淡淡的多边形（象征"刚拼好的图案"）
  ctx.save(); ctx.globalAlpha=.16; ctx.fillStyle='#9FB6D0'; ctx.strokeStyle='#9FB6D0'; ctx.lineWidth=3;
  var poly=[[375,360],[480,470],[400,600],[280,560],[270,430]];
  ctx.beginPath(); poly.forEach(function(p,i){ i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }); ctx.closePath();
  ctx.fill(); ctx.stroke(); ctx.restore();
  // 进度条示意
  roundRect(60,896,630,14,7); ctx.fillStyle='#E8EEF7'; ctx.fill();
  roundRect(60,896,630*0.99,14,7); ctx.fillStyle='#63C88B'; ctx.fill();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ---- 结算面板占位：演示 660ms 后鲜花被遮罩盖住、不遮挡按钮 ---- */
function drawResultPanel(appear){
  if (appear<=0) return;
  var e = easeOutCubic(appear);
  ctx.save();
  ctx.globalAlpha = e;
  // 遮罩
  ctx.fillStyle='rgba(60,45,35,0.24)'; ctx.fillRect(0,0,D.w,D.h);
  // 卡片
  var cardW=560, cardH=560, cx=(D.w-cardW)/2, cy=D.h-cardH-160;
  ctx.translate(0, (1-e)*40);
  roundRect(cx,cy,cardW,cardH,30); ctx.fillStyle='#FFFFFF'; ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='#E3E9F2'; ctx.stroke();
  // 标题
  ctx.fillStyle='#2C3A4B'; ctx.font='700 40px sans-serif'; ctx.textAlign='center';
  ctx.fillText('完成！', D.w/2, cy+90);
  // 星星
  ctx.font='52px sans-serif';
  for (var i=0;i<3;i++) ctx.fillText('★', D.w/2-90+i*90, cy+180);
  // 两个按钮占位（验证热区不被鲜花吞）
  ctx.font='700 32px sans-serif';
  roundRect(cx+40, cy+380, 210,96,18); ctx.fillStyle='#FFB93D'; ctx.fill();
  ctx.fillStyle='#7A4A00'; ctx.fillText('下一关', cx+145, cy+442);
  roundRect(cx+310, cy+380, 210,96,18); ctx.fillStyle='#F4F6F9'; ctx.fill();
  ctx.fillStyle='#5A6B7B'; ctx.fillText('返回', cx+415, cy+442);
  ctx.restore();
}

/* ---- 主循环 ---- */
function frame(ts){
  if (!last) last = ts;
  var dt = Math.min(50, ts-last); last = ts;
  if (playing){
    if (holdFrame>=0){ t = holdFrame; }
    else { t += dt*(slow?0.25:1); if (t>TOTAL){ t=TOTAL; playing=false; } }
  }
  render(t);
  requestAnimationFrame(frame);
}
function render(t){
  ctx.clearRect(0,0,D.w,D.h);
  drawBG();
  if (t>0 && t<=TOTAL){
    var f = flowerState(t);
    drawFlower(MAIN.x, MAIN.y, f.main.s, f.main.a, f.main.p, COLORS, MAIN.petals, MAIN.L, f.main.spin);
    f.sats.forEach(function(s){ if (s.a>0) drawFlower(s.cx,s.cy,s.s,s.a,s.p,[s.cfg.color].map(function(c){return COLORS[c];}),5,MAIN.L*s.cfg.size,0); });
  }
  // 结算面板在鲜花之后绘制 → 永远在鲜花之上（spec §6）
  drawResultPanel(seg(t, FADE_FROM, FADE_FROM+240));
  // UI 进度条
  document.getElementById('tlfill').style.width = (clamp01(t/TOTAL)*100)+'%';
  var name = t<=BUD_END?'孕育':t<=BLOOM_END?'绽放':t<=SETTLE_END?'轻弹':t<=FADE_FROM?'盛开':'淡出';
  document.getElementById('stageLabel').innerHTML='阶段：<b>'+(t>=TOTAL?'结束':name)+'</b>　t = '+Math.round(t)+' ms'+(t>=TOTAL?'　（点「重放」再看一次）':'');
}
function replay(){ t=0; playing=true; holdFrame=-1; last=0; document.getElementById('stageBtn').classList.remove('on'); document.getElementById('stageBtn').textContent='单帧：峰值'; }
document.getElementById('replay').addEventListener('click', replay);
document.getElementById('slow').addEventListener('click', function(){ slow=!slow; this.textContent=slow?'1× 速度':'0.25× 慢放'; this.classList.toggle('on',slow); });
document.getElementById('stageBtn').addEventListener('click', function(){
  if (holdFrame>=0){ holdFrame=-1; playing=true; this.classList.remove('on'); this.textContent='单帧：峰值'; }
  else { holdFrame=242; playing=true; this.classList.add('on'); this.textContent='▶ 继续播放'; }
});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
